# NOTE: contains intentional security test patterns for SAST/SCA/IaC scanning.
AWSTemplateFormatVersion: '2010-09-09'
Description: Sample CloudFormation template for an application

Resources:
  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: sample-app-bucket-12345
      # Fix CWE-284 (TASK-123f20d007ad): Changed from PublicRead to Private
      # ARN: arn:aws:inspector2:us-west-2:381492157536:finding/8e9f5c6e906b20f90725f57ca9d22232
      AccessControl: Private
      # Fix TASK-f39b2ab17306: Add OwnershipControls when AccessControl is set
      # ARN: arn:aws:inspector2:us-west-2:381492157536:finding/0bb190c4f4d0f2171e0309bd42f8f179
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Fix TASK-3cbebc85229c: Enable versioning
      # ARN: arn:aws:inspector2:us-west-2:381492157536:finding/6208a09680770d6bb1093a86787a9def
      VersioningConfiguration:
        Status: Enabled
      # Fix TASK-981722daf99f: Enable Object Lock
      # ARN: arn:aws:inspector2:us-west-2:381492157536:finding/49dc72fcf5d3b805da00daaec1d3e5cd
      ObjectLockEnabled: true
      # Fix TASK-9ffa0440a1ab: Add KMS encryption
      # ARN: arn:aws:inspector2:us-west-2:381492157536:finding/c9cabfa0d4a4808f7f484098b771c76d
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
      # Fix TASK-3eca57ca6c27 / TASK-59a3a68a2686: Removed circular ReplicationConfiguration
      # (AppBucket->ReplicationRole->AppBucket circular dependency removed)
      # ARN: arn:aws:inspector2:us-west-2:381492157536:finding/04f57621f826405856e28b2e591aeaae
      # ARN: arn:aws:inspector2:us-west-2:381492157536:finding/1aeb6819990e3999e7e30626d67842be
      # Fix TASK-4c8b03a249cc: Removed invalid 'Region' property (was inside ReplicationConfiguration)
      # ARN: arn:aws:inspector2:us-west-2:381492157536:finding/e25a7ecb6e0362f498dbd024cd8ba8b3

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AppRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [ec2.amazonaws.com]
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppFullPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: '*'                       # Issue 2: wildcard action (separate finding)
                Resource: '*'                     # Issue 3: wildcard resource (separate finding)

  OpenSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: restricted-security-group
      SecurityGroupIngress:
        # Fix TASK-3e0f981cea60: Restrict SSH CIDR from 0.0.0.0/0 to internal network
        # ARN: arn:aws:inspector2:us-west-2:381492157536:finding/3886fff57097e7bb53d93f789ae6b659
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.0.0.0/8
